<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Totem Huggers</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;800&family=Alegreya:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --iron: #1c1613;        /* charred wood background */
    --iron-raised: #2a211c; /* table rows */
    --blood: #8c1c13;       /* Horde banner red */
    --blood-deep: #5e120c;
    --bronze: #c8a253;      /* trim and highlights */
    --bone: #eadfc8;        /* main text */
    --ash: #9c8e78;         /* secondary text */
    --display: "Grenze Gotisch", "Palatino Linotype", Georgia, serif;
    --body: "Alegreya", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--iron);
    color: var(--bone);
    font-family: var(--body);
    font-size: 1.125rem;
    line-height: 1.6;
  }

  /* Banner image */
  .image-banner { width: 100%; margin: 0; }
  .image-banner h1 { margin: 0; }
  .image-banner img {
    display: block;
    width: 100%;
    height: clamp(120px, 18vw, 240px);
    object-fit: cover;
    object-position: center;
    border-bottom: 3px solid var(--bronze);
  }

  /* Menu bar: stays at the top of the screen while scrolling */
  .menu {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--iron);
    border-bottom: 2px solid var(--blood);
  }
  .menu ul {
    list-style: none;
    margin: 0 auto;
    padding: 0;
    width: min(92%, 760px);
    display: flex;
    gap: 2rem;
  }
  .menu a {
    display: block;
    padding: 0.8rem 0;
    font-family: var(--display);
    font-weight: 600;
    font-size: 1.5rem;
    color: var(--bone);
    text-decoration: none;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
  }
  .menu a:hover, .menu a.current { color: var(--bronze); border-bottom-color: var(--bronze); }
  a:focus-visible { outline: 3px solid var(--bronze); outline-offset: 2px; }

  section { scroll-margin-top: 4.5rem; margin-bottom: 4rem; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  /* Roster, grouped by class */
  .roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
  .class-group { background: var(--iron-raised); border-top: 3px solid; border-radius: 3px; padding: 0.9rem 1rem 1rem; }
  .class-group h3 { margin: 0 0 0.5rem; font-size: 1.15rem; display: flex; justify-content: space-between; }
  .class-group h3 span { color: var(--ash); font-weight: 400; }
  .class-group ul { list-style: none; margin: 0; padding: 0; }
  .class-group li { display: flex; justify-content: space-between; gap: 0.5rem; padding: 0.2rem 0; font-size: 1rem; }
  .class-group li span { color: var(--ash); white-space: nowrap; }

  main { width: min(92%, 760px); margin: 2.5rem auto 4rem; }

  .notice {
    border: 1px solid #4a3a2c;
    border-left: 4px solid var(--bronze);
    padding: 0.75rem 1rem;
    margin-bottom: 2rem;
    color: var(--ash);
    font-size: 1rem;
  }
  .notice strong { color: var(--bone); }

  /* Category switcher */
  .tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.25rem; }
  .tabs button {
    font: inherit;
    font-size: 1rem;
    padding: 0.45rem 1rem;
    background: transparent;
    color: var(--bone);
    border: 1px solid #5a4636;
    border-radius: 3px;
    cursor: pointer;
  }
  .tabs button:hover { border-color: var(--bronze); }
  .tabs button[aria-pressed="true"] {
    background: var(--blood);
    border-color: var(--bronze);
  }
  button:focus-visible { outline: 3px solid var(--bronze); outline-offset: 2px; }

  h2 {
    font-family: var(--display);
    font-weight: 600;
    font-size: 2rem;
    margin: 0 0 0.75rem;
    color: var(--bronze);
  }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
  th {
    text-align: left;
    font-weight: 500;
    color: var(--ash);
    font-size: 0.95rem;
    padding: 0 1rem;
  }
  td { background: var(--iron-raised); padding: 0.7rem 1rem; }
  td:first-child { border-radius: 3px 0 0 3px; width: 4rem; }
  .class-col { width: 4rem; text-align: center; }
  .class-icon {
    width: 28px;
    height: 28px;
    border-radius: 4px;
    border: 1px solid var(--bronze);
    vertical-align: middle;
  }
  td:last-child { border-radius: 0 3px 3px 0; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  th:last-child { text-align: right; }

  .rank {
    display: inline-grid;
    place-items: center;
    width: 2.1rem; height: 2.1rem;
    font-weight: 700;
    color: var(--ash);
  }
  .top .rank { border-radius: 50%; color: var(--iron); }
  .r1 .rank { background: var(--bronze); }
  .r2 .rank { background: #b9b2a6; }
  .r3 .rank { background: #a8693f; }
  .r1 td { box-shadow: inset 0 1px 0 #4d3c22, inset 0 -1px 0 #4d3c22; }

  .player { font-weight: 700; }
  .meta { display: block; font-size: 0.9rem; color: var(--ash); font-weight: 400; }

  footer { text-align: center; color: var(--ash); font-size: 0.9rem; padding-bottom: 3rem; }

  @media (max-width: 520px) {
    td, th { padding-left: 0.6rem; padding-right: 0.6rem; }
    .menu ul { gap: 1.25rem; }
  }
</style>
</head>
<body>
  <header class="image-banner">
    <h1><img src="images/banner.png" alt="Totem Huggers"></h1>
  </header>

  <nav class="menu" aria-label="Main menu">
    <ul>
      <li><a href="#leaderboard">Leaderboard</a></li>
      <li><a href="#roster">Roster</a></li>
    </ul>
  </nav>

  <main>
    <div class="notice" id="notice" hidden>
      <strong>Sample data.</strong> These are made-up players so we can test the page. Real guild stats arrive after WoW: Forever launches on November 4.
    </div>

    <section id="leaderboard">
    <div class="tabs" id="tabs" role="group" aria-label="Choose a leaderboard"></div>
    <h2 id="board-title">Loading…</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Rank</th><th class="class-col">Class</th><th>Player</th><th id="value-heading"></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    </section>

    <section id="roster">
      <h2>Roster</h2>
      <p id="roster-count" class="meta"></p>
      <div class="roster" id="roster-list"></div>
    </section>
  </main>

  <footer id="updated"></footer>

<script>
  const CLASS_COLORS = {
    Warrior: "#c69b6d", Paladin: "#f48cba", Hunter: "#aad372", Rogue: "#fff468",
    Priest: "#ffffff", Shaman: "#4a9eff", Mage: "#3fc7eb", Warlock: "#9fa0f5", Druid: "#ff7c0a",
    "Death Knight": "#e0435a", "Demon Hunter": "#c26fe0", Monk: "#00ff98", Evoker: "#4fc2a8"
  };

  // Class icons in images/class_icons. Classes not listed here show no icon.
  // File names must match exactly, capital letters included.
  const ICON_FOLDER = "images/class_icons/";
  const CLASS_ICONS = {
    Warrior: "warrior.png", Paladin: "paladin.png", Hunter: "hunter.png",
    Rogue: "rogue.png", Priest: "priest.png", Shaman: "shaman.png",
    Mage: "mage.png", Warlock: "warlock.png", Druid: "druid.png",
    Monk: "monk.png", "Death Knight": "deathknight.png"
  };

  let data;

  function showBoard(category) {
    document.querySelectorAll("#tabs button").forEach(b => {
      b.setAttribute("aria-pressed", b.dataset.key === category.key ? "true" : "false");
    });
    document.getElementById("board-title").textContent = category.label;
    document.getElementById("value-heading").textContent = category.column || category.label;

    // Leave out anyone Blizzard had no number for in this category
    const sorted = data.players.filter(p => typeof p.stats[category.key] === "number").sort((a, b) =>
      category.order === "asc"
        ? a.stats[category.key] - b.stats[category.key]
        : b.stats[category.key] - a.stats[category.key]
    );

    const rows = document.getElementById("rows");
    rows.innerHTML = "";
    let rank = 0, lastValue = null;
    sorted.forEach((p, i) => {
      const value = p.stats[category.key];
      if (value !== lastValue) { rank = i + 1; lastValue = value; } // tied players share a rank
      const tr = document.createElement("tr");
      if (rank <= 3) tr.className = "top r" + rank;
      tr.innerHTML = `
        <td><span class="rank">${rank}</span></td>
        <td class="class-col">${CLASS_ICONS[p.class] ? `<img class="class-icon" src="${ICON_FOLDER}${CLASS_ICONS[p.class]}" alt="${p.class}">` : ""}</td>
        <td><span class="player"></span><span class="meta"></span></td>
        <td>${value.toLocaleString()}</td>`;
      const name = tr.querySelector(".player");
      name.textContent = p.name;
      name.style.color = CLASS_COLORS[p.class] || "inherit";
      tr.querySelector(".meta").textContent = `${p.race} ${p.class}`;
      rows.appendChild(tr);
    });
  }

  function showRoster() {
    const byClass = {};
    data.players.forEach(p => (byClass[p.class] ||= []).push(p));
    document.getElementById("roster-count").textContent =
      `${data.players.length} members`;
    const list = document.getElementById("roster-list");
    Object.keys(byClass).sort().forEach(cls => {
      const members = byClass[cls].sort((a, b) => b.stats.level - a.stats.level);
      const box = document.createElement("div");
      box.className = "class-group";
      box.style.borderTopColor = CLASS_COLORS[cls] || "var(--bronze)";
      box.innerHTML = `<h3></h3><ul></ul>`;
      const h3 = box.querySelector("h3");
      h3.textContent = cls;
      h3.style.color = CLASS_COLORS[cls] || "inherit";
      const count = document.createElement("span");
      count.textContent = members.length;
      h3.appendChild(count);
      members.forEach(p => {
        const li = document.createElement("li");
        li.textContent = p.name;
        const lvl = document.createElement("span");
        lvl.textContent = `Lv ${p.stats.level}`;
        li.appendChild(lvl);
        box.querySelector("ul").appendChild(li);
      });
      list.appendChild(box);
    });
  }

  // Underline the menu item for whichever section is on screen
  const menuLinks = document.querySelectorAll(".menu a");
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        menuLinks.forEach(a => a.classList.toggle("current", a.hash === "#" + e.target.id));
      }
    });
  }, { rootMargin: "-40% 0px -55% 0px" });
  document.querySelectorAll("main section").forEach(s => observer.observe(s));

  fetch("players.json?v=" + Date.now(), { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(json => {
      data = json;
      document.getElementById("notice").hidden = !data.sampleData;
      document.getElementById("updated").textContent = `Last updated ${data.updated}`;
      const tabs = document.getElementById("tabs");
      data.categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.textContent = cat.label;
        btn.dataset.key = cat.key;
        btn.addEventListener("click", () => showBoard(cat));
        tabs.appendChild(btn);
      });
      showBoard(data.categories[0]);
      showRoster();
    })
    .catch(() => {
      document.getElementById("board-title").textContent = "The leaderboard couldn't load";
      document.getElementById("rows").innerHTML =
        '<tr><td colspan="4">Check that players.json is in the same folder as index.html and that its name is spelled exactly the same.</td></tr>';
    });
</script>
</body>
</html>
